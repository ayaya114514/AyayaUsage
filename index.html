<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AyayaUsage</title>
<meta name="description" content="Claude Code 每日花费、token 与额度用量">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --raise: #0f0f0f;
    --hover: #161616;
    --line: #1f1f1f;
    --grid: #171717;
    --axis: #333;
    --text: #f5f5f5;
    --text-2: #a8a8a8;
    --muted: #7a7a7a;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --warning: #fab219;
    --critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 56px; }

  .head { display: flex; align-items: center; gap: 12px; }
  .head img { width: 36px; height: 36px; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.25; }
  .sub { margin: 0; color: var(--text-2); font-size: 14px; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; gap: 2px; background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button {
    font: inherit; font-size: 14px; color: var(--text-2); background: none; border: 0;
    padding: 4px 14px; border-radius: 999px; cursor: pointer;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: #262626; color: var(--text); }
  .seg button:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
  .updated { color: var(--muted); font-size: 13px; }

  .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .stat { padding: 18px 16px 20px; min-width: 0; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat:first-child { padding-left: 0; }
  .stat .k { color: var(--text-2); font-size: 13px; }
  .stat .v { font-size: 28px; font-weight: 600; line-height: 1.2; margin-top: 4px; white-space: nowrap; letter-spacing: -0.01em; }
  .stat .d { color: var(--muted); font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { height: 4px; border-radius: 2px; background: #222; margin-top: 10px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 2px; background: var(--s1); }
  .meter i.warn { background: var(--warning); }
  .meter i.crit { background: var(--critical); }

  section.block { padding: 22px 0 14px; border-bottom: 1px solid var(--line); }
  .block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  h2 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .aside { color: var(--text-2); font-size: 13px; }
  .aside b { color: var(--text); font-weight: 600; margin-left: 4px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--text-2); font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  .share { display: flex; gap: 2px; height: 8px; margin: 2px 0 10px; }
  .share i { display: block; height: 100%; border-radius: 2px; min-width: 2px; }
  .share-legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
  .share-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .share-legend i { width: 8px; height: 8px; border-radius: 2px; }
  .share-legend em { font-style: normal; color: var(--text); font-variant-numeric: tabular-nums; }
  .share-legend small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .chart svg { display: block; width: 100%; touch-action: pan-y; }
  .chart text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chart text.val { fill: var(--text-2); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 14px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th, td { text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td { color: var(--text); }
  tbody tr:hover td { background: var(--raise); }
  tfoot td { color: var(--text-2); font-weight: 600; border-bottom: 0; }
  section.block.last { border-bottom: 0; }

  .tip {
    position: fixed; z-index: 10; pointer-events: none; min-width: 160px;
    background: #121212; border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 8px 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.6);
  }
  .tip b { display: block; font-weight: 600; margin-bottom: 4px; }
  .tip div { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
  .tip div em { font-style: normal; color: var(--text); margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; }
  .tip i { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  @media (max-width: 860px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    /* first stat spans the row; the other four sit in two columns */
    .stat { padding: 14px 0 16px; border-top: 1px solid var(--line); }
    .stat + .stat { border-left: 0; }
    .stat:first-child { grid-column: 1 / -1; border-top: 0; }
    .stat:nth-child(even) { padding-right: 16px; }
    .stat:nth-child(odd):not(:first-child) { border-left: 1px solid var(--line); padding-left: 16px; }
    .stat .v { font-size: 24px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <img src="favicon.svg" alt="">
    <div>
      <h1>AyayaUsage</h1>
      <p class="sub">Claude Code 每日花费、token 与额度用量</p>
    </div>
  </header>

  <div class="bar">
    <div class="seg" id="range">
      <button type="button" data-range="7">7 天</button>
      <button type="button" data-range="30">30 天</button>
      <button type="button" data-range="all">全部</button>
    </div>
    <span class="updated" id="updated"></span>
  </div>

  <section class="stats" id="stats"></section>

  <section class="block">
    <div class="block-head"><h2>每日花费<span>API 等价 · USD</span></h2><div class="aside" id="a-cost"></div></div>
    <div class="chart" id="c-cost"></div>
  </section>

  <section class="block">
    <div class="block-head"><h2>每日 token</h2><div class="aside" id="a-tok"></div></div>
    <div class="share" id="share"></div>
    <div class="share-legend" id="share-legend"></div>
    <div class="chart" id="c-tok"></div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>5 小时窗口峰值<span>账号级，含其他客户端</span></h2>
      <div class="legend"><span><i style="background:var(--s1)"></i>峰值</span><span><i style="background:var(--critical)"></i>≥ 90%</span></div>
    </div>
    <div class="chart" id="c-quota"></div>
  </section>

  <section class="block last">
    <div class="block-head"><h2>明细</h2></div>
    <div class="table-wrap"><table id="tbl"></table></div>
  </section>
</main>
<div class="tip" id="tip" hidden></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const TOKENS = [
  { key: 'cache_read', label: '缓存读', color: 'var(--s1)' },
  { key: 'cache_write', label: '缓存写', color: 'var(--s2)' },
  { key: 'input', label: '输入', color: 'var(--s3)' },
  { key: 'output', label: '输出', color: 'var(--s4)' },
];
const FIVE_H = 5 * 3600;

let DATA = null;
let range = '7';
try { range = localStorage.getItem('ayaya-usage-range') || range; } catch (e) {}

// ---------------------------------------------------------------- format

const pad2 = (n) => String(n).padStart(2, '0');
function fmtUSD(v) { return '$' + (v >= 100 ? v.toFixed(0) : v.toFixed(2)); }
function fmtTok(n) {
  for (const [u, s] of [['B', 1e9], ['M', 1e6], ['K', 1e3]]) {
    if (n >= s) { const x = n / s; return (x >= 100 ? x.toFixed(0) : x.toFixed(1)).replace(/\.0$/, '') + u; }
  }
  return String(Math.round(n));
}
function fmtAxisUSD(v) { return '$' + (Number.isInteger(v) ? v : v.toFixed(1)); }
function fmtPct(p) { return p >= 10 ? p.toFixed(0) + '%' : p >= 0.1 ? p.toFixed(1) + '%' : '<0.1%'; }
function mmdd(d) { return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function hhmm(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function ymd(d) { return d.getFullYear() + '-' + mmdd(d); }
function parseDay(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function tokTotal(d) { return TOKENS.reduce((s, t) => s + d[t.key], 0); }
function whenReset(ts) {
  const r = new Date(ts * 1000);
  const same = r.toDateString() === new Date().toDateString();
  return (same ? '' : mmdd(r) + ' ') + hhmm(r) + ' 重置';
}

// ---------------------------------------------------------------- svg

function el(tag, attrs, parent, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function yScale(max, count) {
  if (!(max > 0)) max = 1;
  const step = niceStep(max / count);
  const top = Math.ceil(max / step - 1e-9) * step;
  const ticks = [];
  for (let v = 0; v <= top + step / 2; v += step) ticks.push(v);
  return { top, ticks };
}
function frame(box, top, ticks, fmt) {
  box.textContent = '';
  const W = box.clientWidth;
  const H = W < 560 ? 180 : 220;
  const labels = ticks.map(fmt);
  const m = { l: 14 + Math.max(...labels.map((s) => s.length)) * 7.6, r: 4, t: 18, b: 26 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img' }, box);
  const y = (v) => m.t + ph - (v / top) * ph;
  ticks.forEach((v, i) => {
    const yy = Math.round(y(v)) + 0.5;
    el('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: i === 0 ? 'var(--axis)' : 'var(--grid)' }, svg);
    el('text', { x: m.l - 8, y: yy + 4, 'text-anchor': 'end' }, svg, labels[i]);
  });
  return { svg, W, H, m, pw, ph, y };
}
function colPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h}Z`;
}
function hoverLayer(f, onMove, onLeave) {
  const hit = el('rect', { x: f.m.l, y: 0, width: f.pw, height: f.H, fill: 'transparent' }, f.svg);
  const move = (ev) => { const r = f.svg.getBoundingClientRect(); onMove(ev, ev.clientX - r.left); };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { onLeave(); hideTip(); });
}

// ---------------------------------------------------------------- tooltip

const tip = document.getElementById('tip');
function showTip(ev, title, rows) {
  tip.textContent = '';
  const b = document.createElement('b'); b.textContent = title; tip.appendChild(b);
  for (const r of rows) {
    const div = document.createElement('div');
    if (r.color) { const i = document.createElement('i'); i.style.background = r.color; div.appendChild(i); }
    div.appendChild(document.createTextNode(r.label));
    const em = document.createElement('em'); em.textContent = r.value; div.appendChild(em);
    tip.appendChild(div);
  }
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight, vw = document.documentElement.clientWidth;
  let x = ev.clientX + 14, y = ev.clientY - h - 12;
  if (x + w > vw - 8) x = Math.max(8, ev.clientX - w - 14);
  if (y < 8) y = ev.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.hidden = true; }
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.chart')) hideTip(); });

// ---------------------------------------------------------------- daily columns

function dayLabels(f, n, band, dates) {
  const every = Math.ceil(52 / band);
  dates.forEach((d, i) => {
    if ((n - 1 - i) % every) return;
    el('text', { x: f.m.l + band * (i + 0.5), y: f.H - 7, 'text-anchor': 'middle' }, f.svg, mmdd(d));
  });
}

function drawColumns(box, days, value, color, fmtAxis, fmtVal, tipRows) {
  const vals = days.map(value);
  const max = Math.max(...vals);
  if (!(max > 0)) { box.innerHTML = '<div class="empty">这段时间没有使用记录</div>'; return; }
  const { top, ticks } = yScale(max, 4);
  const f = frame(box, top, ticks, fmtAxis);
  const n = days.length, band = f.pw / n;
  const bw = Math.max(1.5, Math.min(24, band * 0.62));
  const ww = Math.min(band, bw + 16);
  const wash = el('rect', { y: f.m.t - 8, height: f.ph + 8, width: ww, rx: 4, fill: 'var(--hover)', opacity: 0 }, f.svg);
  f.svg.insertBefore(wash, f.svg.querySelector('line'));

  const peak = vals.indexOf(max);
  vals.forEach((v, i) => {
    if (!(v > 0)) return;
    const x = f.m.l + band * i + (band - bw) / 2;
    const h = Math.max(1, f.y(0) - f.y(v));
    const p = el('path', { d: colPath(x, f.y(0) - h, bw, h, 4) }, f.svg);
    p.style.fill = color;
  });
  // Label only the peak day; the tooltip and the table carry the rest.
  el('text', { class: 'val', x: f.m.l + band * (peak + 0.5), y: f.y(max) - 6, 'text-anchor': 'middle' }, f.svg, fmtVal(max));
  dayLabels(f, n, band, days.map((d) => parseDay(d.date)));

  hoverLayer(f, (ev, px) => {
    const i = Math.min(n - 1, Math.max(0, Math.floor((px - f.m.l) / band)));
    wash.setAttribute('x', f.m.l + band * (i + 0.5) - ww / 2);
    wash.setAttribute('opacity', 1);
    showTip(ev, days[i].date, tipRows(days[i]));
  }, () => wash.setAttribute('opacity', 0));
}

// ---------------------------------------------------------------- 5h windows

// One entry per 5-hour window: its peak used_percentage. Readings whose
// resets_at differ by <= 60s belong to the same window.
function fiveHourWindows() {
  const wins = [];
  for (const [t, pct, end] of DATA.quota.five_hour || []) {
    const w = wins[wins.length - 1];
    if (w && Math.abs(end - w.end) <= 60) w.peak = Math.max(w.peak, pct);
    else wins.push({ start: end - FIVE_H, end, peak: pct });
  }
  return wins;
}

function drawWindows(box, t0, t1) {
  const now = Date.now() / 1000;
  const wins = fiveHourWindows().filter((w) => w.end > t0 && w.start < t1);
  if (!wins.length) { box.innerHTML = '<div class="empty">这段时间还没有额度记录</div>'; return; }
  const f = frame(box, 100, [0, 25, 50, 75, 100], (v) => v + '%');
  const x = (t) => f.m.l + ((t - t0) / (t1 - t0)) * f.pw;
  const nDays = Math.round((t1 - t0) / 86400);
  const dayW = f.pw / nDays;
  dayLabels(f, nDays, dayW, Array.from({ length: nDays }, (_, i) => new Date((t0 + i * 86400) * 1000)));
  const bw = Math.max(1.5, Math.min(18, (FIVE_H / (t1 - t0)) * f.pw * 0.7));

  let lastLabel = -Infinity;
  const cx = wins.map((w) => x(Math.max(t0, Math.min(t1, (w.start + w.end) / 2))));
  wins.forEach((w, i) => {
    const h = Math.max(1, f.y(0) - f.y(w.peak));
    const p = el('path', { d: colPath(cx[i] - bw / 2, f.y(0) - h, bw, h, 3) }, f.svg);
    p.style.fill = w.peak >= 90 ? 'var(--critical)' : 'var(--s1)';
    if (w.end > now) p.setAttribute('opacity', 0.6);
    if ((w.peak >= 90 || w.end > now) && cx[i] - lastLabel > 34) {
      el('text', { class: 'val', x: cx[i], y: f.y(w.peak) - 6, 'text-anchor': 'middle' }, f.svg, w.peak + '%');
      lastLabel = cx[i];
    }
  });

  const ring = el('rect', { y: f.m.t - 8, height: f.ph + 8, rx: 4, fill: 'var(--hover)', opacity: 0 }, f.svg);
  f.svg.insertBefore(ring, f.svg.querySelector('line'));
  hoverLayer(f, (ev, px) => {
    let best = -1, dist = Infinity;
    cx.forEach((c, i) => { const d = Math.abs(c - px); if (d < dist) { dist = d; best = i; } });
    if (dist > Math.max(24, bw)) { ring.setAttribute('opacity', 0); hideTip(); return; }
    const w = wins[best];
    ring.setAttribute('x', cx[best] - bw / 2 - 6); ring.setAttribute('width', bw + 12); ring.setAttribute('opacity', 1);
    const s = new Date(w.start * 1000), e = new Date(w.end * 1000);
    showTip(ev, `${mmdd(s)} ${hhmm(s)} – ${hhmm(e)}`, [
      { label: '峰值', value: w.peak + '%', color: w.peak >= 90 ? 'var(--critical)' : 'var(--s1)' },
      { label: '状态', value: w.end > now ? '进行中' : '已结束' },
    ]);
  }, () => ring.setAttribute('opacity', 0));
}

// ---------------------------------------------------------------- stats, share, table

function stat(k, v, d, meter) {
  const t = document.createElement('div');
  t.className = 'stat';
  t.innerHTML = '<div class="k"></div><div class="v"></div>' + (meter != null ? '<div class="meter"><i></i></div>' : '') + '<div class="d"></div>';
  t.querySelector('.k').textContent = k;
  t.querySelector('.v').textContent = v;
  t.querySelector('.d').textContent = d;
  if (meter != null) {
    const i = t.querySelector('.meter i');
    i.style.width = Math.min(100, meter) + '%';
    if (meter >= 90) i.className = 'crit'; else if (meter >= 70) i.className = 'warn';
  }
  return t;
}
function quotaStat(key, label) {
  const pts = DATA.quota[key] || [];
  const last = pts[pts.length - 1];
  if (!last) return stat(label, '—', '暂无记录', 0);
  if (last[2] <= Date.now() / 1000) return stat(label, '0%', '已重置', 0);
  return stat(label, last[1] + '%', whenReset(last[2]), last[1]);
}
function renderStats(days) {
  const box = document.getElementById('stats');
  const sum = (k) => days.reduce((s, d) => s + d[k], 0);
  box.replaceChildren(
    stat('花费', fmtUSD(sum('cost')), 'API 等价，非实际账单'),
    stat('Token', fmtTok(days.reduce((s, d) => s + tokTotal(d), 0)), '输出 ' + fmtTok(sum('output'))),
    stat('会话', String(sum('sessions')), sum('requests') + ' 次请求'),
    quotaStat('five_hour', '5 小时额度'),
    quotaStat('seven_day', '7 天额度'),
  );
}
function renderShare(days) {
  const totals = TOKENS.map((t) => days.reduce((s, d) => s + d[t.key], 0));
  const all = totals.reduce((a, b) => a + b, 0);
  const share = document.getElementById('share');
  const legend = document.getElementById('share-legend');
  share.textContent = ''; legend.textContent = '';
  share.hidden = !all;
  TOKENS.forEach((t, i) => {
    if (all && totals[i]) {
      const seg = document.createElement('i');
      seg.style.background = t.color; seg.style.flex = String(totals[i] / all);
      share.appendChild(seg);
    }
    const s = document.createElement('span');
    s.innerHTML = `<i style="background:${t.color}"></i>${t.label} <em>${fmtTok(totals[i])}</em> <small>${all ? fmtPct((totals[i] / all) * 100) : ''}</small>`;
    legend.appendChild(s);
  });
}
function renderTable(days) {
  const tbl = document.getElementById('tbl');
  const cols = [
    ['日期', (d) => d.date],
    ['会话', (d) => d.sessions],
    ['请求', (d) => d.requests],
    ['花费', (d) => fmtUSD(d.cost)],
    ['输入', (d) => fmtTok(d.input)],
    ['输出', (d) => fmtTok(d.output)],
    ['缓存读', (d) => fmtTok(d.cache_read)],
    ['缓存写', (d) => fmtTok(d.cache_write)],
    ['5 小时 Δ', (d) => d.q5 ? d.q5 + '%' : '—'],
    ['7 天 Δ', (d) => d.q7 ? d.q7 + '%' : '—'],
  ];
  const rows = days.filter((d) => d.requests || d.q5 || d.q7).reverse();
  const total = { date: '合计' };
  for (const k of ['sessions', 'requests', 'cost', 'input', 'output', 'cache_read', 'cache_write', 'q5', 'q7']) {
    total[k] = Math.round(days.reduce((s, d) => s + d[k], 0) * 10000) / 10000;
  }
  total.q5 = Math.round(total.q5 * 10) / 10; total.q7 = Math.round(total.q7 * 10) / 10;
  const line = (d) => '<tr>' + cols.map(([, f]) => `<td>${f(d)}</td>`).join('') + '</tr>';
  tbl.innerHTML =
    '<thead><tr>' + cols.map(([h]) => `<th>${h}</th>`).join('') + '</tr></thead>' +
    '<tbody>' + (rows.length ? rows.map(line).join('') : `<tr><td colspan="${cols.length}" class="empty">暂无数据</td></tr>`) + '</tbody>' +
    (rows.length > 1 ? '<tfoot>' + line(total) + '</tfoot>' : '');
}

// ---------------------------------------------------------------- main

// The selected window as a continuous list of days; days without usage are zeros.
function rangeDays() {
  const byDate = new Map(DATA.days.map((d) => [d.date, d]));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let start = new Date(today);
  if (range === 'all') { if (DATA.days.length) start = parseDay(DATA.days[0].date); }
  else start.setDate(start.getDate() - Number(range) + 1);
  const out = [];
  for (const d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const k = ymd(d);
    out.push(byDate.get(k) || { date: k, sessions: 0, requests: 0, cost: 0, input: 0, output: 0, cache_read: 0, cache_write: 0, q5: 0, q7: 0 });
  }
  return out;
}

function render() {
  hideTip();
  document.querySelectorAll('#range button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.range === range)));
  const days = rangeDays();
  renderStats(days);
  const cost = days.reduce((s, d) => s + d.cost, 0);
  const tok = days.reduce((s, d) => s + tokTotal(d), 0);
  document.getElementById('a-cost').innerHTML = `合计<b>${fmtUSD(cost)}</b>`;
  document.getElementById('a-tok').innerHTML = `合计<b>${fmtTok(tok)}</b>`;
  drawColumns(document.getElementById('c-cost'), days, (d) => d.cost, 'var(--s1)', fmtAxisUSD, fmtUSD, (d) => [
    { label: '花费', value: fmtUSD(d.cost), color: 'var(--s1)' },
    { label: '会话', value: String(d.sessions) },
    { label: '请求', value: String(d.requests) },
  ]);
  renderShare(days);
  drawColumns(document.getElementById('c-tok'), days, tokTotal, 'var(--s1)', fmtTok, fmtTok, (d) =>
    [{ label: '合计', value: fmtTok(tokTotal(d)) }].concat(TOKENS.map((t) => ({ label: t.label, value: fmtTok(d[t.key]), color: t.color }))));
  const t0 = parseDay(days[0].date).getTime() / 1000;
  drawWindows(document.getElementById('c-quota'), t0, t0 + days.length * 86400);
  renderTable(days);
}

document.getElementById('range').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  range = b.dataset.range;
  try { localStorage.setItem('ayaya-usage-range', range); } catch (err) {}
  render();
});

let lastW = 0;
new ResizeObserver(() => {
  const w = document.querySelector('.wrap').clientWidth;
  if (DATA && w !== lastW) { lastW = w; requestAnimationFrame(render); }
}).observe(document.querySelector('.wrap'));

fetch('data.json', { cache: 'no-cache' })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    DATA = data;
    if (!['7', '30', 'all'].includes(range)) range = '7';
    const g = new Date(data.generated_at);
    document.getElementById('updated').textContent = '更新于 ' + mmdd(g) + ' ' + hhmm(g);
    lastW = document.querySelector('.wrap').clientWidth;
    render();
  })
  .catch((err) => {
    document.getElementById('stats').innerHTML = '<div class="empty" style="grid-column:1/-1">数据加载失败（' + String(err.message || err) + '）</div>';
  });
</script>
</body>
