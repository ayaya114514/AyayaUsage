<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AyayaUsage</title>
<meta name="description" content="Claude Code 每日花费、token 与额度用量">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#faf9f5">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light;
    --bg: #faf9f5;
    --raise: #f2f0e8;
    --hover: #efede5;
    --card: #fffefb;
    --line: #e6e3d9;
    --grid: #edebe3;
    --axis: #cfccc0;
    --text: #1f1e1d;
    --text-2: #4d4c48;
    --muted: #73726c;
    --accent: #c96442;
    --s1: #d97757;
    --s2: #5b8ec4;
    --s3: #788c5d;
    --s4: #c09a3e;
    --warning: #c08a1e;
    --critical: #b5432f;
    --serif: ui-serif, Charter, "Iowan Old Style", "Source Serif 4", Georgia, "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 64px; }
  .serif { font-family: var(--serif); }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 24px; flex-wrap: wrap; }
  .seg { display: inline-flex; gap: 20px; }
  .seg button {
    font: inherit; font-size: 15px; color: var(--muted); background: none; border: 0;
    padding: 2px 0 4px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .updated { color: var(--muted); font-size: 13px; }

  .lead { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); gap: 24px 48px; align-items: end; }
  .cost .v { font: 400 64px/1 var(--serif); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .quota { display: grid; gap: 14px; }
  .q { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 2px 12px; }
  .q .k { color: var(--text-2); font-size: 14px; }
  .q .v { font: 400 22px/1.2 var(--serif); text-align: right; font-variant-numeric: tabular-nums; }
  .q .v small { font: 13px var(--sans); color: var(--muted); margin-right: 10px; }
  .meter { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: var(--s1); }
  .meter i.warn { background: var(--warning); }
  .meter i.crit { background: var(--critical); }

  .figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 32px; margin: 32px 0 0; padding: 20px 24px; background: var(--raise); border-radius: 14px; }
  .fig { min-width: 0; }
  .fig .k { color: var(--muted); font-size: 13px; }
  .fig .v { font: 400 28px/1.25 var(--serif); margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  section.block { margin-top: 52px; }
  h2 { margin: 0 0 14px; font: 500 21px/1.3 var(--serif); }

  .share { display: flex; gap: 2px; height: 10px; margin-bottom: 8px; cursor: default; touch-action: manipulation; }
  .share i { display: block; height: 100%; border-radius: 3px; min-width: 2px; }
  .share-legend { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 13px; color: var(--text-2); margin: 4px 0 14px; }
  .share-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .share-legend i { width: 9px; height: 9px; border-radius: 50%; }

  .chart svg { display: block; width: 100%; touch-action: pan-y; }
  .chart text { fill: var(--muted); font-size: 12px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .chart text.val { fill: var(--text); font-family: var(--serif); font-size: 13px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 14px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th, td { text-align: right; padding: 9px 12px; }
  td { border-top: 1px solid var(--grid); color: var(--text-2); }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  th { color: var(--muted); font-weight: 400; font-size: 13px; padding-top: 0; }
  td:first-child { color: var(--text); }
  tbody tr:hover td { color: var(--text); }
  tfoot td { color: var(--text); font-family: var(--serif); font-size: 15px; border-top: 1px solid var(--axis); }

  .tip {
    position: fixed; z-index: 10; pointer-events: none; min-width: 168px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; box-shadow: 0 6px 24px rgba(60, 50, 30, .12);
  }
  .tip b { display: block; font: 500 14px var(--serif); margin-bottom: 4px; }
  .tip div { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
  .tip div em { font-style: normal; color: var(--text); margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; }
  .tip i { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  @media (max-width: 720px) {
    .wrap { padding: 24px 16px 48px; }
    .lead { grid-template-columns: minmax(0, 1fr); }
    .cost .v { font-size: 52px; }
    .figs { gap: 12px 16px; padding: 16px 16px; margin-top: 28px; }
    .fig .v { font-size: 22px; }
    section.block { margin-top: 44px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="bar">
    <div class="seg" id="range">
      <button type="button" data-range="7">7 天</button>
      <button type="button" data-range="30">30 天</button>
      <button type="button" data-range="all">全部</button>
    </div>
    <span class="updated" id="updated"></span>
  </div>

  <section id="stats"></section>

  <section class="block">
    <div class="table-wrap"><table id="tbl"></table></div>
  </section>

  <section class="block">
    <h2>花费</h2>
    <div class="chart" id="c-cost"></div>
  </section>

  <section class="block">
    <h2>Token</h2>
    <div class="share" id="share-tok"></div>
    <div class="share" id="share-usd"></div>
    <div class="share-legend" id="share-legend"></div>
    <div class="chart" id="c-tok"></div>
  </section>
</main>
<div class="tip" id="tip" hidden></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const TOKENS = [
  { key: 'cache_read', usd: 'usd_cache_read', label: '缓存读', color: 'var(--s1)' },
  { key: 'cache_write', usd: 'usd_cache_write', label: '缓存写', color: 'var(--s2)' },
  { key: 'input', usd: 'usd_input', label: '输入', color: 'var(--s3)' },
  { key: 'output', usd: 'usd_output', label: '输出', color: 'var(--s4)' },
];

let DATA = null;
let range = '7';
try { range = localStorage.getItem('ayaya-usage-range') || range; } catch (e) {}

// ---------------------------------------------------------------- format

const pad2 = (n) => String(n).padStart(2, '0');
function fmtUSD(v) { return '$' + (v >= 100 ? v.toFixed(0) : v.toFixed(2)); }
function fmtTok(n) {
  for (const [u, s] of [['B', 1e9], ['M', 1e6], ['K', 1e3]]) {
    if (n >= s) { const x = n / s; return (x >= 100 ? x.toFixed(0) : x.toFixed(1)).replace(/\.0$/, '') + u; }
  }
  return String(Math.round(n));
}
function fmtAxisUSD(v) { return '$' + (Number.isInteger(v) ? v : v.toFixed(1)); }
function fmtPct(p) { return p >= 10 ? p.toFixed(0) + '%' : p >= 0.1 ? p.toFixed(1) + '%' : '<0.1%'; }
function mmdd(d) { return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function hhmm(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function ymd(d) { return d.getFullYear() + '-' + mmdd(d); }
function parseDay(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function tokTotal(d) { return TOKENS.reduce((s, t) => s + d[t.key], 0); }
// Share of prompt tokens served from cache; output tokens never hit the cache.
function hitRate(d) {
  const den = d.cache_read + d.cache_write + d.input;
  return den ? (d.cache_read / den) * 100 : null;
}
function fmtHit(p) { return p == null ? '—' : p.toFixed(1) + '%'; }
function sumDays(days) {
  const out = {};
  for (const d of days) for (const k in d) if (k !== 'date') out[k] = (out[k] || 0) + (d[k] || 0);
  for (const t of TOKENS) { out[t.key] = out[t.key] || 0; out[t.usd] = out[t.usd] || 0; }
  out.cost = out.cost || 0;
  return out;
}
function whenReset(ts) {
  const r = new Date(ts * 1000);
  const same = r.toDateString() === new Date().toDateString();
  return (same ? '' : mmdd(r) + ' ') + hhmm(r);
}

// ---------------------------------------------------------------- svg

function el(tag, attrs, parent, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function yScale(max, count) {
  if (!(max > 0)) max = 1;
  const step = niceStep(max / count);
  const top = Math.ceil(max / step - 1e-9) * step;
  const ticks = [];
  for (let v = 0; v <= top + step / 2; v += step) ticks.push(v);
  return { top, ticks };
}
function frame(box, top, ticks, fmt) {
  box.textContent = '';
  const W = box.clientWidth;
  const H = W < 560 ? 180 : 220;
  const labels = ticks.map(fmt);
  const m = { l: 14 + Math.max(...labels.map((s) => s.length)) * 7.6, r: 4, t: 18, b: 26 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img' }, box);
  const y = (v) => m.t + ph - (v / top) * ph;
  ticks.forEach((v, i) => {
    const yy = Math.round(y(v)) + 0.5;
    el('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: i === 0 ? 'var(--axis)' : 'var(--grid)' }, svg);
    el('text', { x: m.l - 8, y: yy + 4, 'text-anchor': 'end' }, svg, labels[i]);
  });
  return { svg, W, H, m, pw, ph, y };
}
function colPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h}Z`;
}
function hoverLayer(f, onMove, onLeave) {
  const hit = el('rect', { x: f.m.l, y: 0, width: f.pw, height: f.H, fill: 'transparent' }, f.svg);
  const move = (ev) => { const r = f.svg.getBoundingClientRect(); onMove(ev, ev.clientX - r.left); };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { onLeave(); hideTip(); });
}

// ---------------------------------------------------------------- tooltip

const tip = document.getElementById('tip');
function showTip(ev, title, rows) {
  tip.textContent = '';
  const b = document.createElement('b'); b.textContent = title; tip.appendChild(b);
  for (const r of rows) {
    const div = document.createElement('div');
    if (r.color) { const i = document.createElement('i'); i.style.background = r.color; div.appendChild(i); }
    div.appendChild(document.createTextNode(r.label));
    const em = document.createElement('em'); em.textContent = r.value; div.appendChild(em);
    tip.appendChild(div);
  }
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight, vw = document.documentElement.clientWidth;
  let x = ev.clientX + 14, y = ev.clientY - h - 12;
  if (x + w > vw - 8) x = Math.max(8, ev.clientX - w - 14);
  if (y < 8) y = ev.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.hidden = true; }
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.chart, .share')) hideTip(); });

// ---------------------------------------------------------------- daily columns

function dayLabels(f, n, band, dates) {
  const every = Math.ceil(52 / band);
  dates.forEach((d, i) => {
    if ((n - 1 - i) % every) return;
    el('text', { x: f.m.l + band * (i + 0.5), y: f.H - 7, 'text-anchor': 'middle' }, f.svg, mmdd(d));
  });
}

function drawDaily(box, days, value, color, fmtAxis, fmtVal, tipRows) {
  const vals = days.map(value);
  const max = Math.max(...vals);
  if (!(max > 0)) { box.innerHTML = '<div class="empty">这段时间没有使用记录</div>'; return; }
  const { top, ticks } = yScale(max, 4);
  const f = frame(box, top, ticks, fmtAxis);
  const n = days.length, band = f.pw / n;
  const bw = Math.max(1.5, Math.min(24, band * 0.62));
  const ww = Math.min(band, bw + 16);
  const cx = (i) => f.m.l + band * (i + 0.5);
  const wash = el('rect', { y: f.m.t - 8, height: f.ph + 8, width: ww, rx: 4, fill: 'var(--hover)', opacity: 0 }, f.svg);
  f.svg.insertBefore(wash, f.svg.querySelector('line'));
  const peak = vals.indexOf(max);
  vals.forEach((v, i) => {
    if (!(v > 0)) return;
    const h = Math.max(1, f.y(0) - f.y(v));
    const p = el('path', { d: colPath(cx(i) - bw / 2, f.y(0) - h, bw, h, 4) }, f.svg);
    p.style.fill = color;
  });
  // Label only the peak day; the tooltip and the table carry the rest.
  el('text', { class: 'val', x: cx(peak), y: f.y(max) - 6, 'text-anchor': 'middle' }, f.svg, fmtVal(max));
  dayLabels(f, n, band, days.map((d) => parseDay(d.date)));

  hoverLayer(f, (ev, px) => {
    const i = Math.min(n - 1, Math.max(0, Math.floor((px - f.m.l) / band)));
    wash.setAttribute('x', cx(i) - ww / 2);
    wash.setAttribute('opacity', 1);
    showTip(ev, days[i].date, tipRows(days[i]));
  }, () => wash.setAttribute('opacity', 0));
}

// ---------------------------------------------------------------- stats, share, table

function node(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function fig(k, v) {
  const t = node('div', 'fig');
  t.append(node('div', 'k', k), node('div', 'v', v));
  return t;
}
function quotaRow(key, label) {
  const pts = DATA.quota[key] || [];
  const last = pts[pts.length - 1];
  let v = '—', d = '', pct = 0;
  if (last && last[2] <= Date.now() / 1000) v = '0%';
  else if (last) { v = last[1] + '%'; d = whenReset(last[2]); pct = last[1]; }
  const t = node('div', 'q');
  const val = node('div', 'v');
  val.append(node('small', null, d), v);
  const meter = node('div', 'meter');
  const i = node('i', pct >= 90 ? 'crit' : pct >= 70 ? 'warn' : null);
  i.style.width = Math.min(100, pct) + '%';
  meter.appendChild(i);
  t.append(node('div', 'k', label), val, meter);
  return t;
}
function renderStats(days) {
  const box = document.getElementById('stats');
  const t = sumDays(days);
  const cost = node('div', 'cost');
  cost.append(node('div', 'v', fmtUSD(t.cost)));
  const quota = node('div', 'quota');
  quota.append(quotaRow('five_hour', '5h'), quotaRow('seven_day', '7d'));
  const lead = node('div', 'lead');
  lead.append(cost, quota);
  const figs = node('div', 'figs');
  figs.append(
    fig('Token', fmtTok(tokTotal(t))),
    fig('命中率', fmtHit(hitRate(t))),
    fig('会话', String(t.sessions || 0)),
  );
  box.replaceChildren(lead, figs);
}
function fillShare(id, title, values, fmt) {
  const bar = document.getElementById(id);
  const all = values.reduce((a, b) => a + b, 0);
  bar.textContent = '';
  TOKENS.forEach((t, i) => {
    if (!all || !values[i]) return;
    const seg = document.createElement('i');
    seg.style.background = t.color; seg.style.flex = String(values[i] / all);
    bar.appendChild(seg);
  });
  const rows = TOKENS.map((t, i) => ({
    label: t.label, color: t.color,
    value: fmt(values[i]) + ' · ' + (all ? fmtPct((values[i] / all) * 100) : '—'),
  }));
  bar.onpointermove = bar.onpointerdown = (ev) => showTip(ev, title, rows);
  bar.onpointerleave = hideTip;
}
function renderShare(days) {
  const sum = sumDays(days);
  fillShare('share-tok', '按 token', TOKENS.map((t) => sum[t.key]), fmtTok);
  fillShare('share-usd', '按花费', TOKENS.map((t) => sum[t.usd]), fmtUSD);
  const legend = document.getElementById('share-legend');
  legend.textContent = '';
  for (const t of TOKENS) {
    const s = document.createElement('span');
    s.innerHTML = `<i style="background:${t.color}"></i>${t.label}`;
    legend.appendChild(s);
  }
}
function renderTable(days) {
  const tbl = document.getElementById('tbl');
  const cols = [
    ['日期', (d) => d.date],
    ['花费', (d) => fmtUSD(d.cost)],
    ['Token', (d) => fmtTok(tokTotal(d))],
    ['命中率', (d) => fmtHit(hitRate(d))],
    ['会话', (d) => d.sessions],
  ];
  const rows = days.filter((d) => d.requests).reverse();
  const total = { date: '合计' };
  for (const k of ['sessions', 'requests', 'cost', 'input', 'output', 'cache_read', 'cache_write']) {
    total[k] = Math.round(days.reduce((s, d) => s + d[k], 0) * 10000) / 10000;
  }
  const line = (d) => '<tr>' + cols.map(([, f]) => `<td>${f(d)}</td>`).join('') + '</tr>';
  tbl.innerHTML =
    '<thead><tr>' + cols.map(([h]) => `<th>${h}</th>`).join('') + '</tr></thead>' +
    '<tbody>' + (rows.length ? rows.map(line).join('') : `<tr><td colspan="${cols.length}" class="empty">暂无数据</td></tr>`) + '</tbody>' +
    (rows.length > 1 ? '<tfoot>' + line(total) + '</tfoot>' : '');
}

// ---------------------------------------------------------------- main

// The selected window as a continuous list of days; days without usage are zeros.
function rangeDays() {
  const byDate = new Map(DATA.days.map((d) => [d.date, d]));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let start = new Date(today);
  if (range === 'all') { if (DATA.days.length) start = parseDay(DATA.days[0].date); }
  else start.setDate(start.getDate() - Number(range) + 1);
  const out = [];
  for (const d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const k = ymd(d);
    out.push(byDate.get(k) || { date: k, sessions: 0, requests: 0, cost: 0, input: 0, output: 0, cache_read: 0, cache_write: 0, q5: 0, q7: 0 });
  }
  return out;
}

function render() {
  hideTip();
  document.querySelectorAll('#range button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.range === range)));
  const days = rangeDays();
  renderStats(days);
  drawDaily(document.getElementById('c-cost'), days, (d) => d.cost, 'var(--s1)', fmtAxisUSD, fmtUSD, (d) => [
    { label: '花费', value: fmtUSD(d.cost), color: 'var(--s1)' },
    { label: '会话', value: String(d.sessions) },
    { label: '请求', value: String(d.requests) },
  ]);
  renderShare(days);
  drawDaily(document.getElementById('c-tok'), days, tokTotal, 'var(--s1)', fmtTok, fmtTok, (d) =>
    [{ label: '合计', value: fmtTok(tokTotal(d)) }, { label: '命中率', value: fmtHit(hitRate(d)) }]
      .concat(TOKENS.map((t) => ({ label: t.label, value: fmtTok(d[t.key]), color: t.color }))));
  renderTable(days);
}

document.getElementById('range').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  range = b.dataset.range;
  try { localStorage.setItem('ayaya-usage-range', range); } catch (err) {}
  render();
});

let lastW = 0;
new ResizeObserver(() => {
  const w = document.querySelector('.wrap').clientWidth;
  if (DATA && w !== lastW) { lastW = w; requestAnimationFrame(render); }
}).observe(document.querySelector('.wrap'));

fetch('data.json', { cache: 'no-cache' })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    DATA = data;
    if (!['7', '30', 'all'].includes(range)) range = '7';
    const g = new Date(data.generated_at);
    document.getElementById('updated').textContent = mmdd(g) + ' ' + hhmm(g);
    lastW = document.querySelector('.wrap').clientWidth;
    render();
  })
  .catch((err) => {
    document.getElementById('stats').innerHTML = '<div class="empty">数据加载失败（' + String(err.message || err) + '）</div>';
  });
</script>
</body>
</html>
