<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AyayaUsage</title>
<meta name="description" content="Claude Code 每日花费、token 与额度用量">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --bg: #121211;
    --panel: #1c1c1b;
    --panel-2: #262624;
    --border: #30302d;
    --text: #f4f3ef;
    --text-2: #c3c2b7;
    --muted: #9a988f;
    --grid: #2c2c2a;
    --axis: #45443f;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --warning: #fab219;
    --critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 48px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head img { width: 40px; height: 40px; }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { margin: 0; color: var(--text-2); font-size: 14px; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 14px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .seg button {
    font: inherit; font-size: 14px; color: var(--text-2); background: none; border: 0;
    padding: 5px 14px; border-radius: 6px; cursor: pointer;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }
  .seg button:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
  .updated { color: var(--muted); font-size: 13px; }

  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .tile .k { color: var(--text-2); font-size: 13px; }
  .tile .v { font-size: 24px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
  .tile .d { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { height: 6px; border-radius: 3px; background: var(--panel-2); margin: 8px 0 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: var(--s1); }
  .meter i.warn { background: var(--warning); }
  .meter i.crit { background: var(--critical); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 10px; margin-top: 12px; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  h2 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--text-2); font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; }
  .legend i.line { height: 2px; width: 14px; border-radius: 1px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; touch-action: pan-y; }
  .chart text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 36px 0; text-align: center; font-size: 14px; }

  .table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  th { color: var(--text-2); font-weight: 500; font-size: 13px; }
  td { color: var(--text); }
  tfoot td { color: var(--text-2); font-weight: 600; border-bottom: 0; }

  .tip {
    position: fixed; z-index: 10; pointer-events: none; min-width: 150px;
    background: #2a2a28; border: 1px solid #3d3d3a; border-radius: 8px;
    padding: 8px 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  .tip b { display: block; font-weight: 600; margin-bottom: 4px; }
  .tip div { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
  .tip div em { font-style: normal; color: var(--text); margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
  .tip i { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  @media (max-width: 860px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tiles .tile:first-child { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <img src="favicon.svg" alt="">
    <div>
      <h1>AyayaUsage</h1>
      <p class="sub">Claude Code 每日花费、token 与额度用量</p>
    </div>
  </header>

  <div class="bar">
    <div class="seg" id="range">
      <button type="button" data-range="7">7 天</button>
      <button type="button" data-range="30">30 天</button>
      <button type="button" data-range="all">全部</button>
    </div>
    <span class="updated" id="updated"></span>
  </div>

  <section class="tiles" id="tiles"></section>

  <section class="panel">
    <div class="panel-head"><h2>每日花费<span>API 等价 · USD</span></h2></div>
    <div class="chart" id="c-cost"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>每日 token</h2><div class="legend" id="l-tok"></div></div>
    <div class="chart" id="c-tok"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>额度用量<span>账号级，含其他客户端</span></h2><div class="legend" id="l-quota"></div></div>
    <div class="chart" id="c-quota"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>明细</h2></div>
    <div class="table-wrap"><table id="tbl"></table></div>
  </section>
</main>
<div class="tip" id="tip" hidden></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const TOKENS = [
  { key: 'cache_read', label: '缓存读', color: 'var(--s1)' },
  { key: 'cache_write', label: '缓存写', color: 'var(--s2)' },
  { key: 'input', label: '输入', color: 'var(--s3)' },
  { key: 'output', label: '输出', color: 'var(--s4)' },
];
const COST = [{ key: 'cost', label: '花费', color: 'var(--s1)' }];
const QUOTA = [
  { key: 'five_hour', label: '5 小时', color: 'var(--s1)' },
  { key: 'seven_day', label: '7 天', color: 'var(--s2)' },
];

let DATA = null;
let range = '30';
try { range = localStorage.getItem('ayaya-usage-range') || range; } catch (e) {}

// ---------------------------------------------------------------- format

const pad2 = (n) => String(n).padStart(2, '0');
function fmtUSD(v) { return '$' + (v >= 100 ? v.toFixed(0) : v.toFixed(2)); }
function fmtTok(n) {
  for (const [u, s] of [['B', 1e9], ['M', 1e6], ['K', 1e3]]) {
    if (n >= s) { const x = n / s; return (x >= 100 ? x.toFixed(0) : x.toFixed(1)).replace(/\.0$/, '') + u; }
  }
  return String(Math.round(n));
}
function fmtAxisUSD(v) { return '$' + (v >= 10 || v === 0 ? v.toFixed(0) : v.toFixed(v % 1 ? 1 : 0)); }
function mmdd(d) { return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function hhmm(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function parseDay(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function tokTotal(d) { return TOKENS.reduce((s, t) => s + d[t.key], 0); }

// ---------------------------------------------------------------- svg

function el(tag, attrs, parent, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function yScale(max, count) {
  if (!(max > 0)) max = 1;
  const step = niceStep(max / count);
  const top = Math.ceil(max / step - 1e-9) * step;
  const ticks = [];
  for (let v = 0; v <= top + step / 2; v += step) ticks.push(v);
  return { top, ticks };
}
function frame(box, top, ticks, fmt) {
  box.textContent = '';
  const W = box.clientWidth;
  const H = W < 560 ? 190 : 230;
  const labels = ticks.map(fmt);
  const m = { l: 10 + Math.max(...labels.map((s) => s.length)) * 7.2, r: 6, t: 10, b: 26 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const svg = el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img' }, box);
  const y = (v) => m.t + ph - (v / top) * ph;
  ticks.forEach((v, i) => {
    const yy = Math.round(y(v)) + 0.5;
    el('line', { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: i === 0 ? 'var(--axis)' : 'var(--grid)' }, svg);
    el('text', { x: m.l - 8, y: yy + 4, 'text-anchor': 'end' }, svg, labels[i]);
  });
  return { svg, W, H, m, pw, ph, y };
}
function colPath(x, y, w, h, r) {
  if (r <= 0) return `M${x},${y}h${w}v${h}h${-w}Z`;
  return `M${x},${y + h}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h}Z`;
}

// ---------------------------------------------------------------- tooltip

const tip = document.getElementById('tip');
function showTip(ev, title, rows) {
  tip.textContent = '';
  const b = document.createElement('b'); b.textContent = title; tip.appendChild(b);
  for (const r of rows) {
    const div = document.createElement('div');
    if (r.color) { const i = document.createElement('i'); i.style.background = r.color; div.appendChild(i); }
    div.appendChild(document.createTextNode(r.label));
    const em = document.createElement('em'); em.textContent = r.value; div.appendChild(em);
    tip.appendChild(div);
  }
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight, vw = document.documentElement.clientWidth;
  let x = ev.clientX + 14, y = ev.clientY - h - 12;
  if (x + w > vw - 8) x = Math.max(8, ev.clientX - w - 14);
  if (y < 8) y = ev.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.hidden = true; }
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.chart')) hideTip(); });

// ---------------------------------------------------------------- columns

function drawColumns(box, days, series, fmtAxis, tipRows) {
  if (!days.length) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const totals = days.map((d) => series.reduce((s, se) => s + d[se.key], 0));
  const { top, ticks } = yScale(Math.max(...totals), 4);
  const f = frame(box, top, ticks, fmtAxis);
  const n = days.length, band = f.pw / n;
  const bw = Math.max(1, Math.min(24, band * 0.72));
  const ww = Math.min(band, bw + 20);
  const wash = el('rect', { y: f.m.t, height: f.ph, width: ww, rx: 4, fill: 'var(--panel-2)', opacity: 0 }, f.svg);
  f.svg.insertBefore(wash, f.svg.firstChild);

  days.forEach((d, i) => {
    const x = f.m.l + band * i + (band - bw) / 2;
    const segs = series.filter((se) => d[se.key] > 0);
    let base = 0;
    segs.forEach((se, j) => {
      const y0 = f.y(base), y1 = f.y(base + d[se.key]);
      base += d[se.key];
      const h = y0 - y1 - (j > 0 ? 2 : 0);  // 2px surface gap between stacked segments
      if (h < 0.5) return;
      const r = j === segs.length - 1 ? Math.min(4, bw / 2, h) : 0;
      const p = el('path', { d: colPath(x, y1, bw, h, r) }, f.svg);
      p.style.fill = se.color;
    });
  });

  const every = Math.ceil(56 / band);
  days.forEach((d, i) => {
    if ((n - 1 - i) % every) return;
    el('text', { x: f.m.l + band * (i + 0.5), y: f.H - 7, 'text-anchor': 'middle' }, f.svg, mmdd(parseDay(d.date)));
  });

  const hit = el('rect', { x: f.m.l, y: f.m.t, width: f.pw, height: f.ph, fill: 'transparent' }, f.svg);
  const move = (ev) => {
    const r = f.svg.getBoundingClientRect();
    const i = Math.min(n - 1, Math.max(0, Math.floor((ev.clientX - r.left - f.m.l) / band)));
    wash.setAttribute('x', f.m.l + band * (i + 0.5) - ww / 2);
    wash.setAttribute('opacity', 1);
    showTip(ev, days[i].date, tipRows(days[i]));
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { wash.setAttribute('opacity', 0); hideTip(); });
}

// ---------------------------------------------------------------- quota

// Step-after: a reading holds until the next one, or drops to 0 when its
// window resets first. Before the first reading the value is unknown.
function quotaAt(points, t) {
  let p = null;
  for (const q of points) { if (q[0] <= t) p = q; else break; }
  if (!p) return null;
  return p[2] <= t ? 0 : p[1];
}

function drawQuota(box, t0, t1) {
  const f = frame(box, 100, [0, 25, 50, 75, 100], (v) => v + '%');
  const x = (t) => f.m.l + ((t - t0) / (t1 - t0)) * f.pw;
  const nDays = Math.round((t1 - t0) / 86400);
  const every = Math.max(1, Math.ceil(56 / (f.pw / Math.max(1, nDays))));
  const d0 = new Date(t0 * 1000);
  for (let i = 0; ; i++) {
    const d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + i);
    const t = d.getTime() / 1000;
    if (t > t1) break;
    if (i % every === 0 && x(t) < f.W - 20) {
      el('line', { x1: Math.round(x(t)) + 0.5, x2: Math.round(x(t)) + 0.5, y1: f.m.t, y2: f.m.t + f.ph, stroke: 'var(--grid)' }, f.svg);
      el('text', { x: x(t), y: f.H - 7, 'text-anchor': i === 0 ? 'start' : 'middle' }, f.svg, mmdd(d));
    }
  }

  let any = false;
  for (const s of QUOTA) {
    const pts = (DATA.quota[s.key] || []);
    const cuts = new Set([t0, t1]);
    pts.forEach((p, i) => {
      if (p[0] > t0 && p[0] < t1) cuts.add(p[0]);
      const next = pts[i + 1];
      if (p[2] > t0 && p[2] < t1 && (!next || p[2] < next[0])) cuts.add(p[2]);
    });
    const ts = [...cuts].sort((a, b) => a - b);
    let d = '', open = false;
    for (const t of ts) {
      const v = quotaAt(pts, t);
      if (v == null) { open = false; continue; }
      d += open ? `H${x(t).toFixed(1)}V${f.y(v).toFixed(1)}` : `M${x(t).toFixed(1)},${f.y(v).toFixed(1)}`;
      open = true;
    }
    if (!d) continue;
    any = true;
    const path = el('path', { d, fill: 'none', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, f.svg);
    path.style.stroke = s.color;
    const end = quotaAt(pts, t1);
    if (end != null) {
      const c = el('circle', { cx: x(t1), cy: f.y(end), r: 4, 'stroke-width': 2, stroke: 'var(--panel)' }, f.svg);
      c.style.fill = s.color;
    }
  }
  if (!any) { box.innerHTML = '<div class="empty">这段时间还没有额度记录</div>'; return; }

  const cross = el('line', { y1: f.m.t, y2: f.m.t + f.ph, stroke: 'var(--muted)', opacity: 0 }, f.svg);
  const dots = QUOTA.map((s) => { const c = el('circle', { r: 4, 'stroke-width': 2, stroke: 'var(--panel)', opacity: 0 }, f.svg); c.style.fill = s.color; return c; });
  const hit = el('rect', { x: f.m.l, y: f.m.t, width: f.pw, height: f.ph, fill: 'transparent' }, f.svg);
  const move = (ev) => {
    const r = f.svg.getBoundingClientRect();
    const px = Math.min(f.m.l + f.pw, Math.max(f.m.l, ev.clientX - r.left));
    const t = t0 + ((px - f.m.l) / f.pw) * (t1 - t0);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('opacity', 0.6);
    const rows = QUOTA.map((s, i) => {
      const v = quotaAt(DATA.quota[s.key] || [], t);
      dots[i].setAttribute('opacity', v == null ? 0 : 1);
      if (v != null) { dots[i].setAttribute('cx', px); dots[i].setAttribute('cy', f.y(v)); }
      return { label: s.label, value: v == null ? '—' : v + '%', color: s.color };
    });
    const d = new Date(t * 1000);
    showTip(ev, mmdd(d) + ' ' + hhmm(d), rows);
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { cross.setAttribute('opacity', 0); dots.forEach((c) => c.setAttribute('opacity', 0)); hideTip(); });
}

// ---------------------------------------------------------------- tiles & table

function tile(k, v, d, meter) {
  const t = document.createElement('div');
  t.className = 'tile';
  t.innerHTML = '<div class="k"></div><div class="v"></div>' + (meter != null ? '<div class="meter"><i></i></div>' : '') + '<div class="d"></div>';
  t.querySelector('.k').textContent = k;
  t.querySelector('.v').textContent = v;
  t.querySelector('.d').textContent = d;
  if (meter != null) {
    const i = t.querySelector('.meter i');
    i.style.width = Math.min(100, meter) + '%';
    if (meter >= 90) i.className = 'crit'; else if (meter >= 70) i.className = 'warn';
  }
  return t;
}
function quotaTile(s) {
  const pts = DATA.quota[s.key] || [];
  const last = pts[pts.length - 1];
  const now = Date.now() / 1000;
  if (!last) return tile(s.label + '额度', '—', '暂无记录', 0);
  if (last[2] <= now) return tile(s.label + '额度', '0%', '已重置', 0);
  const r = new Date(last[2] * 1000);
  const same = r.toDateString() === new Date().toDateString();
  return tile(s.label + '额度', last[1] + '%', (same ? '' : mmdd(r) + ' ') + hhmm(r) + ' 重置', last[1]);
}
function renderTiles(days) {
  const box = document.getElementById('tiles');
  box.textContent = '';
  const sum = (k) => days.reduce((s, d) => s + d[k], 0);
  const tok = days.reduce((s, d) => s + tokTotal(d), 0);
  box.append(
    tile('花费', fmtUSD(sum('cost')), 'API 等价，非实际账单'),
    tile('Token', fmtTok(tok), '输出 ' + fmtTok(sum('output'))),
    tile('会话', String(sum('sessions')), sum('requests') + ' 次请求'),
    quotaTile(QUOTA[0]),
    quotaTile(QUOTA[1]),
  );
}
function renderTable(days) {
  const tbl = document.getElementById('tbl');
  const cols = [
    ['日期', (d) => d.date],
    ['会话', (d) => d.sessions],
    ['请求', (d) => d.requests],
    ['花费', (d) => fmtUSD(d.cost)],
    ['输入', (d) => fmtTok(d.input)],
    ['输出', (d) => fmtTok(d.output)],
    ['缓存读', (d) => fmtTok(d.cache_read)],
    ['缓存写', (d) => fmtTok(d.cache_write)],
    ['5 小时 Δ', (d) => d.q5 ? d.q5 + '%' : '—'],
    ['7 天 Δ', (d) => d.q7 ? d.q7 + '%' : '—'],
  ];
  const rows = days.filter((d) => d.requests || d.q5 || d.q7).reverse();
  const total = { date: '合计' };
  for (const k of ['sessions', 'requests', 'cost', 'input', 'output', 'cache_read', 'cache_write', 'q5', 'q7']) {
    total[k] = days.reduce((s, d) => s + d[k], 0);
  }
  total.q5 = Math.round(total.q5 * 10) / 10; total.q7 = Math.round(total.q7 * 10) / 10;
  const line = (tag, d) => '<tr>' + cols.map(([, f]) => `<${tag}>${f(d)}</${tag}>`).join('') + '</tr>';
  tbl.innerHTML =
    '<thead><tr>' + cols.map(([h]) => `<th>${h}</th>`).join('') + '</tr></thead>' +
    '<tbody>' + (rows.length ? rows.map((d) => line('td', d)).join('') : `<tr><td colspan="${cols.length}" class="empty">暂无数据</td></tr>`) + '</tbody>' +
    (rows.length > 1 ? '<tfoot>' + line('td', total) + '</tfoot>' : '');
}

// ---------------------------------------------------------------- main

function legend(id, series, line) {
  document.getElementById(id).innerHTML = series.map((s) =>
    `<span><i class="${line ? 'line' : ''}" style="background:${s.color}"></i>${s.label}</span>`).join('');
}

function inRange() {
  const all = DATA.days;
  if (range === 'all' || !all.length) return all;
  const n = Number(range);
  const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - n + 1);
  return all.filter((d) => parseDay(d.date) >= start);
}

function render() {
  hideTip();
  document.querySelectorAll('#range button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.range === range)));
  const days = inRange();
  renderTiles(days);
  drawColumns(document.getElementById('c-cost'), days, COST, fmtAxisUSD, (d) => [
    { label: '花费', value: fmtUSD(d.cost), color: COST[0].color },
    { label: '会话', value: String(d.sessions) },
    { label: '请求', value: String(d.requests) },
  ]);
  drawColumns(document.getElementById('c-tok'), days, TOKENS, fmtTok, (d) =>
    [...TOKENS].reverse().map((t) => ({ label: t.label, value: fmtTok(d[t.key]), color: t.color }))
      .concat([{ label: '合计', value: fmtTok(tokTotal(d)) }]));
  if (days.length) {
    drawQuota(document.getElementById('c-quota'), parseDay(days[0].date).getTime() / 1000, Date.now() / 1000);
  } else {
    document.getElementById('c-quota').innerHTML = '<div class="empty">暂无数据</div>';
  }
  renderTable(days);
}

document.getElementById('range').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  range = b.dataset.range;
  try { localStorage.setItem('ayaya-usage-range', range); } catch (err) {}
  render();
});

let lastW = 0;
new ResizeObserver(() => {
  const w = document.querySelector('.wrap').clientWidth;
  if (DATA && w !== lastW) { lastW = w; requestAnimationFrame(render); }
}).observe(document.querySelector('.wrap'));

legend('l-tok', TOKENS, false);
legend('l-quota', QUOTA, true);

fetch('data.json', { cache: 'no-cache' })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    DATA = data;
    if (!['7', '30', 'all'].includes(range)) range = '30';
    const g = new Date(data.generated_at);
    document.getElementById('updated').textContent = '更新于 ' + mmdd(g) + ' ' + hhmm(g);
    lastW = document.querySelector('.wrap').clientWidth;
    render();
  })
  .catch((err) => {
    document.getElementById('tiles').innerHTML = '<div class="empty" style="grid-column:1/-1">数据加载失败（' + String(err.message || err) + '）</div>';
  });
</script>
</body>
</html>
